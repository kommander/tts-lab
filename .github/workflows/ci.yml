name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run check:python

  swift:
    runs-on: macos-15
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - run: swift test --package-path packages/kokoro-local-runtime/swift
